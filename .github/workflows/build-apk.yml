name: Gerar APK

# Roda quando você aperta o botão na aba Actions, e também a cada push na main.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Sem isto o token do GitHub vem só com permissão de LEITURA, e a etapa de
    # publicar o Release falha com "403 Resource not accessible by integration".
    # O APK compila normalmente; é só a publicação que é barrada.
    permissions:
      contents: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      # O Capacitor copia os arquivos do site a partir de uma pasta só dele.
      # Sem isso ele tentaria copiar o repositório inteiro (incluindo node_modules
      # e a própria pasta android), o que quebra o build.
      - name: Separar os arquivos do site
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css  www/
          cp -r js       www/
          # ponte do navegador embutido (só ativa dentro do APK)
          cp js-theater/theater.js www/js/ 2>/dev/null || true
          # se você tiver imagens/fontes locais, acrescente aqui. Ex:
          # cp -r assets www/ 2>/dev/null || true

      - name: Instalar o Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Montar o projeto Android
        run: |
          npx cap add android

      # Gera o ícone em TODOS os tamanhos que o Android exige, a partir de uma
      # imagem só (assets/icon.png). Se você não enviar a imagem, o build segue
      # normalmente com o ícone padrão do Capacitor.
      - name: Gerar ícone do app
        env:
          # Para trocar o ícone depois, é só mudar este endereço — ou enviar um
          # arquivo em assets/icon.png, que tem prioridade sobre ele.
          ICON_URL: "https://i.postimg.cc/HLY9Xkyt/Tumblr-l-16411380525183.png"
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.png ] && [ -n "$ICON_URL" ]; then
            echo "baixando o ícone..."
            curl -fsSL "$ICON_URL" -o /tmp/icon-original.png || echo "falha ao baixar"
          fi

          if [ -f /tmp/icon-original.png ] || [ -f assets/icon.png ]; then
            SRC=assets/icon.png
            [ -f /tmp/icon-original.png ] && [ ! -f assets/icon.png ] && SRC=/tmp/icon-original.png

            # O gerador exige uma imagem QUADRADA de pelo menos 1024x1024. Como a
            # imagem original pode ter qualquer proporção, encaixamos ela dentro de
            # um quadrado preto (combina com o tema escuro do app) sem distorcer
            # nem cortar nada.
            convert "$SRC" -background black -resize 1024x1024 \
                    -gravity center -extent 1024x1024 assets/icon.png
            echo "ícone preparado em 1024x1024"

            # Só o ícone: sem tela de abertura, o app abre direto.
            npm install --no-save @capacitor/assets
            npx capacitor-assets generate --android || echo 'aviso do gerador ignorado (o ícone é o que importa)'
            echo "ícone aplicado"
          else
            echo "sem imagem — usando ícone padrão"
          fi

      # O 'cap add android' regenera a pasta android/ do zero a cada build, então
      # o plugin nativo e as permissões precisam ser aplicados DEPOIS dele —
      # senão seriam apagados.
      # O 'cap add android' regenera a pasta android/ do zero a cada build, então
      # o plugin nativo e as permissões precisam ser aplicados DEPOIS dele —
      # senão seriam apagados.
      - name: Instalar o plugin do navegador embutido
        run: |
          python3 native/patch_android.py
          npx cap sync android

      - name: Compilar o APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear o arquivo
        run: |
          mkdir -p saida
          cp android/app/build/outputs/apk/debug/app-debug.apk saida/there-fm.apk

      # Fica guardado na aba Actions (vem dentro de um .zip)
      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: there-fm-apk
          path: saida/there-fm.apk

      # Publica também como Release — este é o jeito fácil de baixar no celular,
      # porque vira um link direto para o .apk, sem precisar descompactar nada.
      - name: Publicar para download direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: there.fm APK ${{ github.run_number }}
          files: saida/there-fm.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
