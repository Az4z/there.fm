Enter<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17151a">
  <meta name="description" content="There FM — sala colaborativa para música, vídeos, imagens e conversa">
  <title>There FM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>

<body>
  <div id="app">

    <!-- LANDING -->
    <main id="landingView" class="view landing-view">
      <section class="landing-shell">
        <div class="brand-mark" aria-label="There FM">
          <div class="brand-symbol">✦</div>
          <h1>Templo FM</h1>
          <p>Uma sala para compartilhar presença</p>
        </div>

        <div class="landing-card">
          <div class="field-group">
            <label for="nameInput">Seu nome</label>
            <input
              id="nameInput"
              class="input"
              type="text"
              maxlength="40"
              autocomplete="nickname"
              placeholder="Como você quer aparecer?"
            >
          </div>

          <div class="landing-actions">
            <button id="createRoomBtn" class="btn btn-primary" type="button">
              Criar sala
            </button>

            <button id="joinRoomBtn" class="btn btn-secondary" type="button">
              Entrar em uma sala
            </button>
          </div>

          <div id="joinRoomBox" class="join-room-box" hidden>
            <label for="roomCodeInput">Código da sala</label>

            <div class="inline-form">
              <input
                id="roomCodeInput"
                class="input"
                type="text"
                maxlength="12"
                autocomplete="off"
                placeholder="Ex.: AB12CD"
              >

              <button id="confirmJoinBtn" class="btn btn-primary" type="button">
                Entrar
              </button>
            </div>
          </div>

          <p id="landingStatus" class="status-text" role="status"></p>
        </div>
      </section>
    </main>

    <!-- ROOM -->
    <main id="roomView" class="view room-view" hidden>
      <section id="roomScene" class="room-scene">

        <header id="roomHeader" class="room-header">
          <div class="room-brand">
            <span class="room-symbol">✦</span>
            <span>Templo FM</span>
          </div>

          <div class="room-actions">
            <div class="room-code-wrap">
              <span class="muted-label">Sala</span>
              <strong id="rcode">------</strong>
              <button id="copyCodeBtn" class="icon-btn" type="button" title="Copiar código">
                ⧉
              </button>
            </div>

            <span id="connectionStatus" class="connection-status offline">
              Offline
            </span>

            <button id="leaveRoomBtn" class="btn btn-danger btn-small" type="button">
              Sair
            </button>
          </div>
        </header>

        <div id="roomBody" class="room-body">
          <div id="cw" class="canvas-wrap">
            <canvas id="bgCanvas" aria-hidden="true"></canvas>
            <canvas id="drawCanvas" aria-label="Quadro de desenho"></canvas>
            <div id="items" class="items-layer"></div>
            <div id="capture" class="interaction-capture"></div>
          </div>
        </div>

        <aside id="participantsPanel" class="participants-panel">
          <div class="panel-heading">
            <span>Participantes</span>
            <button id="closeParticipantsBtn" class="icon-btn" type="button">×</button>
          </div>

          <div id="partsList" class="participants-list"></div>
        </aside>

        <aside id="toolbar" class="toolbar" aria-label="Ferramentas">
          <button id="participantsBtn" class="tool-btn" type="button" title="Participantes">
            <span>♙</span>
          </button>

          <button id="drawBtn" class="tool-btn" type="button" title="Desenhar">
            <span>✎</span>
          </button>

          <button id="gifBtn" class="tool-btn" type="button" title="Adicionar GIF">
            <span>GIF</span>
          </button>

          <button id="imageBtn" class="tool-btn" type="button" title="Adicionar imagem">
            <span>▧</span>
          </button>

          <button id="videoBtn" class="tool-btn" type="button" title="Adicionar vídeo">
            <span>▶</span>
          </button>

          <button id="musicBtn" class="tool-btn" type="button" title="Música">
            <span>♫</span>
          </button>

          <button id="themeBtn" class="tool-btn" type="button" title="Alterar tema">
            <span>☾</span>
          </button>
        </aside>

        <section id="drawBar" class="draw-bar" aria-label="Ferramentas de desenho">
          <div id="drawColors" class="draw-colors"></div>

          <label class="range-control">
            Tamanho
            <input id="brushSize" type="range" min="2" max="60" value="8">
          </label>

          <label class="range-control">
            Opacidade
            <input id="brushOpacity" type="range" min="10" max="100" value="100">
          </label>

          <span id="bprevdot" class="brush-preview"></span>

          <button id="eraserBtn" class="btn btn-secondary btn-small" type="button">
            Borracha
          </button>

          <button id="undoDrawBtn" class="btn btn-secondary btn-small" type="button">
            Desfazer
          </button>

          <button id="clearDrawBtn" class="btn btn-danger btn-small" type="button">
            Limpar
          </button>
        </section>

        <section id="chatBar" class="chat-bar">
          <input
            id="msgInput"
            class="input chat-input"
            type="text"
            maxlength="300"
            autocomplete="off"
            placeholder="Escreva uma mensagem..."
          >

          <button id="sendMsgBtn" class="btn btn-primary btn-small" type="button">
            Enviar
          </button>
        </section>

      </section>
    </main>

    <!-- GIF MODAL -->
    <div id="gifModal" class="modal-backdrop" hidden>
      <section class="modal-box" role="dialog" aria-modal="true" aria-labelledby="gifModalTitle">
        <header class="modal-header">
          <h2 id="gifModalTitle">Escolher GIF</h2>
          <button class="icon-btn modal-close" type="button" data-close-modal="gifModal">×</button>
        </header>

        <div class="modal-content">
          <div class="inline-form">
            <input id="gifSearch" class="input" type="search" placeholder="Buscar GIF">
            <button id="gifSearchBtn" class="btn btn-primary" type="button">Buscar</button>
          </div>

          <div id="gifResults" class="gif-results"></div>
        </div>
      </section>
    </div>

    <!-- IMAGE MODAL -->
    <div id="imageModal" class="modal-backdrop" hidden>
      <section class="modal-box" role="dialog" aria-modal="true" aria-labelledby="imageModalTitle">
        <header class="modal-header">
          <h2 id="imageModalTitle">Adicionar imagem</h2>
          <button class="icon-btn modal-close" type="button" data-close-modal="imageModal">×</button>
        </header>

        <div class="modal-content">
          <input id="imgFile" class="input" type="file" accept="image/*">

          <div id="imgPrev" class="image-preview" hidden>
            <img id="imgPrevEl" alt="Pré-visualização da imagem">
          </div>

          <div class="modal-actions">
            <button id="clearImgBtn" class="btn btn-secondary" type="button">
              Limpar
            </button>

            <button id="confirmImgBtn" class="btn btn-primary" type="button">
              Adicionar
            </button>
          </div>
        </div>
      </section>
    </div>

    <!-- VIDEO MODAL -->
    <div id="univVideoPanel" class="modal-backdrop" hidden>
      <section class="modal-box" role="dialog" aria-modal="true" aria-labelledby="videoModalTitle">
        <header class="modal-header">
          <h2 id="videoModalTitle">Adicionar vídeo</h2>
          <button class="icon-btn modal-close" type="button" data-close-modal="univVideoPanel">×</button>
        </header>

        <div class="modal-content">
          <label for="univVideoUrl">URL do vídeo</label>
          <input
            id="univVideoUrl"
            class="input"
            type="url"
            placeholder="YouTube, Vimeo, Twitch ou vídeo direto"
          >

          <div class="modal-actions">
            <button id="addVideoBtn" class="btn btn-primary" type="button">
              Adicionar vídeo
            </button>
          </div>
        </div>
      </section>
    </div>

    <!-- MUSIC PANEL -->
    <div id="musicPanel" class="modal-backdrop" hidden>
      <section class="modal-box music-panel-box" role="dialog" aria-modal="true" aria-labelledby="musicPanelTitle">
        <header class="modal-header">
          <h2 id="musicPanelTitle">YouTube Music</h2>
          <button class="icon-btn modal-close" type="button" data-close-modal="musicPanel">×</button>
        </header>

        <div id="musicSimilarSec" class="music-section" hidden>
          <div class="section-label">✦ Parecidas com essa</div>
          <div id="musicSimilarResults"></div>
        </div>

        <div id="musicNowPlayingBar" class="now-playing" hidden>
          <div class="now-playing-label">▶ Adicionado agora</div>
          <strong id="musicNowTitle"></strong>
          <span id="musicNowArtist"></span>
        </div>

        <div class="music-search-area">
          <div class="inline-form">
            <input
              id="musicSearchInput"
              class="input"
              type="search"
              placeholder="Artista, clima ou gênero"
            >

            <button id="musicSearchBtn" class="btn btn-primary" type="button">
              Buscar
            </button>
          </div>

          <div id="musicChips" class="music-chips">
            <button class="chip" type="button" data-query="Lo-fi pra estudar">Lo-fi</button>
            <button class="chip" type="button" data-query="Sertanejo raiz">Sertanejo</button>
            <button class="chip" type="button" data-query="Funk brasileiro hits">Funk</button>
            <button class="chip" type="button" data-query="MPB clássicos">MPB</button>
            <button class="chip" type="button" data-query="Pop internacional hits">Pop</button>
            <button class="chip" type="button" data-query="Rock anos 80 90">Rock</button>
            <button class="chip" type="button" data-query="Trap brasileiro">Trap</button>
            <button class="chip" type="button" data-query="Eletrônica pra festa">Eletrônica</button>
          </div>

          <div id="musicResults" class="music-results"></div>
        </div>
      </section>
    </div>

    <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="./js/main.js"></script>
</body>
  </html>
