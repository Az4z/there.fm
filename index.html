<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>there.fm | Collaborating</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --void: #070708; --abyss: #0c0c0e; --depth: #121216; --surface: #1a1a20;
  --ridge: #25252d; --mist: #2e2e38; --fog: #3d3d4a; --bone: #e8e4dc;
  --ash: #b8b0a4; --dust: #8a8278; --shadow: #5a544e; --crimson: #c45c5c;
  --crimson-glow: rgba(196,92,92,0.12); --gold: #b8a070; --gold-glow: rgba(184,160,112,0.15);
  --silver: #8a9098; --ghost: rgba(232,228,220,0.04); --glass: rgba(18,18,22,0.88);
  --blur: blur(24px) saturate(160%); --ease: cubic-bezier(0.16,1,0.3,1);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'Inter',sans-serif; background:var(--void); color:var(--bone); overflow:hidden; height:100vh; }

/* Background Motion */
.void-bg { position:fixed; inset:0; z-index:0; pointer-events:none; }
.orb { position:absolute; border-radius:50%; filter:blur(100px); opacity:.15; animation:orbMove 25s infinite alternate ease-in-out; }
.orb-1 { width:600px; height:600px; background:var(--crimson); top:-10%; left:-10%; }
.orb-2 { width:500px; height:500px; background:var(--gold); bottom:-5%; right:-5%; animation-delay:-5s; }
@keyframes orbMove { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(50px, 80px) scale(1.1); } }

/* Scene Management */
.scene { position:fixed; inset:0; z-index:10; display:none; opacity:0; transition: opacity 0.8s var(--ease); }
.scene.active { display:flex; opacity:1; }

/* Auth UI (Clean & Sophisticated) */
.auth-scene { justify-content:center; align-items:center; background: radial-gradient(circle at center, #121216 0%, #070708 100%); }
.auth-card { background:var(--glass); backdrop-filter:var(--blur); padding:3rem; border-radius:32px; border:1px solid var(--ghost); width:90%; max-width:420px; text-align:center; transform:translateY(20px); animation:cardIn 1s var(--ease) forwards; }
@keyframes cardIn { to { transform:translateY(0); } }
.brand h1 { font-family:'Cinzel',serif; letter-spacing:8px; font-size:1.5rem; margin-bottom:2rem; color:var(--bone); }

/* Room UI */
.room-header { position:fixed; top:0; left:0; right:0; height:70px; display:flex; align-items:center; justify-content:space-between; padding:0 2rem; background:var(--glass); backdrop-filter:var(--blur); border-bottom:1px solid var(--ghost); z-index:1000; }
.nav-btns { display:flex; gap:12px; }
.btn-icon { background:var(--surface); border:1px solid var(--ridge); color:var(--ash); padding:8px 16px; border-radius:12px; cursor:pointer; font-size:13px; transition:0.3s var(--ease); }
.btn-icon:hover { background:var(--ridge); color:var(--bone); border-color:var(--crimson); }

/* Canvas & Draggables */
.canvas { flex:1; position:relative; overflow:hidden; cursor: crosshair; }
.draggable { position:absolute; min-width:150px; background:var(--glass); border:1px solid var(--ghost); border-radius:16px; backdrop-filter:var(--blur); overflow:hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4); touch-action:none; }
.drag-header { padding:8px 12px; display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.03); cursor:move; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dust); }
.btn-close { cursor:pointer; color:var(--crimson); font-size:18px; border:none; background:none; }
.resizer { position:absolute; width:16px; height:16px; bottom:0; right:0; cursor:nwse-resize; background: linear-gradient(135deg, transparent 50%, var(--crimson) 50%); }

/* Avatar & Bubbles */
.avatar-wrap { position:absolute; width:80px; text-align:center; transition: transform 0.1s linear; z-index:999; }
.avatar-circle { width:60px; height:60px; border-radius:50%; background:var(--crimson); margin:0 auto; border:2px solid var(--bone); overflow:hidden; display:flex; align-items:center; justify-content:center; box-shadow:0 0 20px var(--crimson-glow); }
.avatar-circle img { width:100%; height:100%; object-fit:cover; }
.chat-bubble { position:absolute; bottom:70px; left:50%; transform:translateX(-50%); background:var(--bone); color:var(--void); padding:8px 16px; border-radius:18px; font-size:13px; font-weight:500; opacity:0; pointer-events:none; transition:0.3s var(--ease); min-width:80px; }
.chat-bubble.show { opacity:1; transform:translateX(-50%) translateY(-10px); }

/* Bottom Bar */
.bottom-bar { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); width:90%; max-width:600px; display:flex; gap:12px; z-index:1000; }
.msg-input { flex:1; background:var(--glass); backdrop-filter:var(--blur); border:1px solid var(--ghost); padding:14px 24px; border-radius:100px; color:white; outline:none; }

/* YouTube Sync UI */
.yt-controls { display:flex; justify-content:space-around; background:var(--abyss); padding:8px; gap:4px; }
.yt-btn { background:var(--surface); border:none; color:var(--ash); font-size:10px; padding:6px; border-radius:4px; cursor:pointer; flex:1; }

input[type="file"] { display: none; }
</style>
</head>
<body>

<div class="void-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
</div>

<div class="scene auth-scene active" id="authScene">
    <div class="auth-card">
        <div class="brand"><h1>there.fm</h1></div>
        <input type="text" id="userNameInput" placeholder="Seu Nome" style="width:100%; padding:14px; margin-bottom:12px; border-radius:12px; border:1px solid var(--ridge); background:var(--abyss); color:white;">
        <button class="btn-icon" style="width:100%; padding:14px; background:var(--crimson); color:white; border:none;" onclick="login()">Entrar</button>
    </div>
</div>

<div class="scene auth-scene" id="dashScene">
    <div class="auth-card">
        <div class="brand"><h1>there.fm</h1></div>
        <p id="welcomeMsg" style="margin-bottom:20px; color:var(--ash)"></p>
        <button class="btn-icon" style="width:100%; margin-bottom:10px" onclick="startRoom()">Criar Sala</button>
        <button class="btn-icon" style="width:100%; margin-bottom:10px" onclick="document.getElementById('profileFile').click()">Mudar Foto</button>
        <button class="btn-icon" style="width:100%; color:var(--crimson)" onclick="location.reload()">Sair</button>
        <input type="file" id="profileFile" accept="image/*" onchange="updateProfilePic(this)">
    </div>
</div>

<div class="scene" id="roomScene" style="flex-direction:column">
    <div class="room-header">
        <div style="font-family:'Cinzel'; letter-spacing:2px">there.fm</div>
        <div class="nav-btns">
            <button class="btn-icon" onclick="document.getElementById('galeryFile').click()">+ Foto</button>
            <button class="btn-icon" onclick="addGif()">+ GIF</button>
            <button class="btn-icon" onclick="addYoutube()">+ Video</button>
            <button class="btn-icon" style="border-color:var(--crimson)" onclick="exitRoom()">Sair</button>
        </div>
    </div>

    <div class="canvas" id="canvas">
        </div>

    <div class="bottom-bar">
        <input type="text" id="chatInput" class="msg-input" placeholder="Escreva algo...">
        <button class="btn-icon" style="background:var(--crimson); color:white; border:none; border-radius:100px; padding:0 25px;" onclick="sendChat()">Enviar</button>
    </div>
</div>

<input type="file" id="galeryFile" accept="image/*" onchange="addImage(this)">

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let user = { name: "", photo: null, x: 500, y: 500 };
let players = {};

/* --- AUTH --- */
function login() {
    const name = document.getElementById('userNameInput').value;
    if(!name) return;
    user.name = name;
    document.getElementById('welcomeMsg').innerText = `Bem-vindo, ${name}`;
    switchScene('dashScene');
}

function updateProfilePic(input) {
    const reader = new FileReader();
    reader.onload = e => { user.photo = e.target.result; alert("Foto atualizada!"); };
    reader.readAsDataURL(input.files[0]);
}

function startRoom() {
    switchScene('roomScene');
    spawnUser();
}

function switchScene(id) {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* --- AVATAR & CHAT --- */
function spawnUser() {
    const wrap = document.createElement('div');
    wrap.className = 'avatar-wrap';
    wrap.id = 'myAvatar';
    wrap.style.left = user.x + 'px';
    wrap.style.top = user.y + 'px';
    
    const circle = document.createElement('div');
    circle.className = 'avatar-circle';
    circle.innerHTML = user.photo ? `<img src="${user.photo}">` : user.name[0];
    
    const bubble = document.createElement('div');
    bubble.className = 'chat-bubble';
    bubble.id = 'myBubble';
    
    wrap.appendChild(bubble);
    wrap.appendChild(circle);
    document.getElementById('canvas').appendChild(wrap);
    makeDraggable(wrap, true);
}

function sendChat() {
    const input = document.getElementById('chatInput');
    const bubble = document.getElementById('myBubble');
    if(!input.value) return;
    
    bubble.innerText = input.value;
    bubble.classList.add('show');
    input.value = "";
    setTimeout(() => bubble.classList.remove('show'), 3000);
}

/* --- ADD MEDIA --- */
function addImage(input) {
    const reader = new FileReader();
    reader.onload = e => createBox('IMAGEM', `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:cover; pointer-events:none;">`);
    reader.readAsDataURL(input.files[0]);
}

async function addGif() {
    const q = prompt("Qual GIF você quer?");
    if(!q) return;
    try {
        const res = await fetch(`https://tenor.googleapis.com/v2/search?q=${q}&key=LIVDSRZULELA&limit=1`);
        const data = await res.json();
        const url = data.results[0].media_formats.tinygif.url;
        createBox('GIF', `<img src="${url}" style="width:100%; height:100%; object-fit:cover; pointer-events:none;">`);
    } catch(e) { alert("GIF não encontrado"); }
}

function addYoutube() {
    const url = prompt("Link do YouTube:");
    if(!url) return;
    const id = url.match(/(?:v=|\/embed\/|youtu.be\/)([^&?/\s]+)/)[1];
    const pid = "p" + Date.now();
    
    const html = `
        <div id="${pid}" style="width:100%; height:150px"></div>
        <div class="yt-controls">
            <button class="yt-btn" onclick="syncVideo('${pid}','play')">PLAY</button>
            <button class="yt-btn" onclick="syncVideo('${pid}','pause')">PAUSE</button>
            <button class="yt-btn" onclick="syncVideo('${pid}','rewind')">-10s</button>
        </div>
    `;
    createBox('YOUTUBE', html, pid, id);
}

function createBox(label, content, pid, vidId) {
    const box = document.createElement('div');
    box.className = 'draggable';
    box.style.left = '100px';
    box.style.top = '100px';
    box.style.width = '250px';
    
    box.innerHTML = `
        <div class="drag-header">
            <span>${label}</span>
            <button class="btn-close" onclick="this.closest('.draggable').remove()">&times;</button>
        </div>
        <div class="drag-body" style="width:100%; height:calc(100% - 30px)">${content}</div>
        <div class="resizer"></div>
    `;
    
    document.getElementById('canvas').appendChild(box);
    makeDraggable(box);
    
    if(pid) {
        players[pid] = new YT.Player(pid, { videoId: vidId, playerVars: { controls: 0 } });
    }
}

function syncVideo(pid, action) {
    const p = players[pid];
    if(action === 'play') p.playVideo();
    if(action === 'pause') p.pauseVideo();
    if(action === 'rewind') p.seekTo(p.getCurrentTime() - 10);
}

/* --- MOTION & DRAG ENGINE --- */
function makeDraggable(el, isAvatar = false) {
    let x = 0, y = 0, startX = 0, startY = 0;
    const header = isAvatar ? el : el.querySelector('.drag-header');
    const resizer = el.querySelector('.resizer');

    header.addEventListener('mousedown', dragStart);
    header.addEventListener('touchstart', dragStart, {passive: false});

    if(resizer) {
        resizer.addEventListener('mousedown', initResize);
        resizer.addEventListener('touchstart', initResize, {passive: false});
    }

    function dragStart(e) {
        const t = e.type === 'touchstart' ? e.touches[0] : e;
        startX = t.clientX - el.offsetLeft;
        startY = t.clientY - el.offsetTop;
        document.onmousemove = dragMove;
        document.ontouchmove = dragMove;
        document.onmouseup = dragEnd;
        document.ontouchend = dragEnd;
    }

    function dragMove(e) {
        e.preventDefault();
        const t = e.type === 'touchmove' ? e.touches[0] : e;
        el.style.left = (t.clientX - startX) + "px";
        el.style.top = (t.clientY - startY) + "px";
    }

    function dragEnd() {
        document.onmousemove = null; document.ontouchmove = null;
    }

    function initResize(e) {
        e.stopPropagation();
        const t = e.type === 'touchstart' ? e.touches[0] : e;
        startX = t.clientX;
        startY = t.clientY;
        const startW = el.offsetWidth;
        const startH = el.offsetHeight;

        function doResize(e) {
            const t = e.type === 'touchmove' ? e.touches[0] : e;
            el.style.width = (startW + (t.clientX - startX)) + "px";
            el.style.height = (startH + (t.clientY - startY)) + "px";
        }
        function stopResize() { document.onmousemove = null; document.ontouchmove = null; }
        document.onmousemove = doResize;
        document.ontouchmove = doResize;
        document.onmouseup = stopResize;
        document.ontouchend = stopResize;
    }
}

function exitRoom() { switchScene('dashScene'); document.getElementById('canvas').innerHTML = ""; }
</script>
</body>
</html>
