function handleSPhoto(input){ const f=input.files[0]; if(!f) return; pendingAvatarFile=f; const r=new FileReader(); r.onload=e=>{ U.photo=e.target.result; const el=$('editAvatar'); if(el) el.innerHTML=`<img src="${U.photo}">`; saveU(); }; r.readAsDataURL(f); }
function handleSFrame(input){ const f=input.files[0]; if(!f) return; pendingFrameFile=f; const r=new FileReader(); r.onload=e=>{ const pf=$('editFramePreview'); pf.src=e.target.result; pf.style.display='block'; updateFramePreview(); }; r.readAsDataURL(f); }
function handleSBanner(input){ const f=input.files[0]; if(!f) return; pendingBannerFile=f; const r=new FileReader(); r.onload=e=>{ U.banner=e.target.result; saveU(); }; r.readAsDataURL(f); }

async function loadMyProfile(){
  try{
    const supa=getSupa();
    const { data, error } = await supa.from('profiles').select('*').eq('id', U.id).limit(1).maybeSingle();
    if(error){ /* no table or permission */ console.warn('profiles load err',error); applyLocalProfile(); return; }
    if(data){ U = {...U, ...data}; applyLocalProfile(); }
  }catch(e){ console.warn(e); applyLocalProfile(); }
}
function applyLocalProfile(){ // apply into UI
  saveU(); const el=$('sNm'); if(el) el.value=U.name||''; const un=$('sUname'); if(un) un.value=U.username||''; const bio=$('sBio'); if(bio) bio.value=U.bio||'';
  const av=$('editAvatar'); if(av){ if(U.photo) av.innerHTML=`<img src="${U.photo}">`; else av.innerHTML=`<span class="sinit" id="editInit">${(U.name||'A').charAt(0).toUpperCase()}</span>` }
  const bannerPreview = $('editBannerPreview'); if(bannerPreview) bannerPreview.src=U.banner||'';
  if(U.frame){ const pf=$('editFramePreview'); if(pf){ pf.src=U.frame; pf.style.display='block'; }}
  // frame controls
  $('frameScale').value = U.frame_scale || 1; $('frameX').value = U.frame_x || 0; $('frameY').value = U.frame_y || 0; updateFramePreview();
}

/* ── PROFILE SAVE / UPLOAD ── */
async function uploadToSupaBucket(file, path){
  try{
    const supa=getSupa();
    // Use storage bucket 'profiles'
    const fp = `${path}`;
    // remove existing
    await supa.storage.from('profiles').remove([fp]).catch(()=>{});
    const { data, error } = await supa.storage.from('profiles').upload(fp, file, { cacheControl: '3600', upsert: true });
    if(error){ console.warn('upload err', error); return null; }
    const { publicUrl, error: e2 } = supa.storage.from('profiles').getPublicUrl(fp);
    if(e2){ console.warn('getPublicUrl', e2); }
    return publicUrl || null;
  }catch(e){ console.warn(e); return null; }
}

async function saveProfileToSupa(){
  // Upload pending files and upsert to profiles table
  try{
    const supa=getSupa();
    if(pendingAvatarFile){ const p=`avatars/${U.id}-avatar-${Date.now()}.png`; const url=await uploadToSupaBucket(p,pendingAvatarFile); if(url) U.photo=url; pendingAvatarFile=null; }
    if(pendingFrameFile){ const p=`frames/${U.id}-frame-${Date.now()}.png`; const url=await uploadToSupaBucket(p,pendingFrameFile); if(url) U.frame=url; pendingFrameFile=null; }
    if(pendingBannerFile){ const p=`banners/${U.id}-banner-${Date.now()}.png`; const url=await uploadToSupaBucket(p,pendingBannerFile); if(url) U.banner=url; pendingBannerFile=null; }
    // upsert profile row
    const payload = {
      id: U.id,
      name: U.name || null,
      email: U.email || null,
      username: U.username || null,
      bio: U.bio || null,
      photo: U.photo || null,
      banner: U.banner || null,
      frame: U.frame || null,
      frame_x: parseFloat(U.frame_x)||0,
      frame_y: parseFloat(U.frame_y)||0,
      frame_scale: parseFloat(U.frame_scale)||1
    };
    const { data, error } = await supa.from('profiles').upsert(payload, { onConflict: 'id' }).select().maybeSingle();
    if(error){ console.warn('saveProfile err', error); toast('Erro ao salvar perfil (Supa)','err'); return false; }
    toast('Perfil salvo','ok'); saveU(); return true;
  }catch(e){ console.warn(e); toast('Erro ao salvar perfil','err'); return false; }
}

/* ── SETTINGS UI ── */
function openSettings(){
  $('sNm').value=U.name||''; $('sUname').value=U.username||''; $('sBio').value=U.bio||'';
  const av=$('editAvatar'); if(av){ if(U.photo) av.innerHTML=`<img src="${U.photo}">`; else av.innerHTML=`<span class="sinit">${(U.name||'A').charAt(0).toUpperCase()}</span>` }
  if(U.frame){ const pf=$('editFramePreview'); if(pf){ pf.src=U.frame; pf.style.display='block'; }}
  $('frameScale').value = U.frame_scale || 1; $('frameX').value = U.frame_x || 0; $('frameY').value = U.frame_y || 0; updateFramePreview();
  $('settingsPanel').classList.add('on');
}
function closeSettings(){ $('settingsPanel').classList.remove('on'); }

function updateFramePreview(){ const pf=$('editFramePreview'); const avWrap=$('editAvatarWrap'); if(!pf||!avWrap) return; const scale = parseFloat($('frameScale').value); const x = parseInt($('frameX').value); const y = parseInt($('frameY').value);
  pf.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  pf.style.width='96px'; pf.style.height='96px';
  U.frame_scale = scale; U.frame_x = x; U.frame_y = y;
}

function setFramePreset(url){ const pf=$('editFramePreview'); pf.src=url; pf.style.display='block'; U.frame = url; updateFramePreview(); }

function requestFramePattern(){ // simple handler: just toast and pretend to create a request
  toast('Solicitação enviada — obrigado!','ok'); }

async function saveSettings(){
  const n=$('sNm').value.trim(), un=$('sUname').value.trim(), bio=$('sBio').value.trim();
  if(n) U.name = n; if(un) U.username = un; U.bio = bio;
  saveU(); // local
  const ok = await saveProfileToSupa(); if(ok){ broadcastMyInfo(); closeSettings(); }
}

/* ── PUBLIC PROFILE VIEW & FRIENDS ── */
async function openPublicProfile(uid){
  // fetch profile from supabase
  try{
    const supa=getSupa();
    const { data, error } = await supa.from('profiles').select('*').eq('id', uid).limit(1).maybeSingle();
    let profile = data;
    if(error || !profile){ // fallback to local if it's current user
      if(uid===U.id){ profile = U; } else { toast('Perfil não encontrado','err'); return; }
    }
    showPublicProfile(profile);
  }catch(e){ console.warn(e); toast('Erro ao abrir perfil','err'); }
}

async function showPublicProfile(p){
  const container = $('publicProfileContent'); container.innerHTML='';
  const card = document.createElement('div'); card.className='profile-card-public';
  const banner = document.createElement('div'); banner.style.height='120px'; banner.style.borderRadius='8px'; banner.style.backgroundImage = p.banner?`url(${p.banner})`:`url(${DISC_THEME_URL})`; banner.style.backgroundSize='cover'; banner.style.backgroundPosition='center'; card.appendChild(banner);
  const row = document.createElement('div'); row.style.display='flex'; row.style.gap='.8rem'; row.style.marginTop='0.7rem';
  const avwrap = document.createElement('div'); avwrap.style.width='96px'; avwrap.style.flex='0 0 96px'; avwrap.style.position='relative';
  const avat = document.createElement('div'); avat.className='profile-avatar'; avat.innerHTML = p.photo?`<img src="${p.photo}">`:`<span style="display:flex;align-items:center;justify-content:center;height:100%">${(p.name||'A').charAt(0)}</span>`;
  avwrap.appendChild(avat);
  if(p.frame){ const fimg = document.createElement('img'); fimg.src = p.frame; fimg.className='profile-frame'; fimg.style.transform = `translate(${(p.frame_x||0)}px, ${(p.frame_y||0)}px) scale(${(p.frame_scale||1)})`; avwrap.appendChild(fimg); }
  row.appendChild(avwrap);
  const info = document.createElement('div'); info.style.flex='1';
  const nameEl = document.createElement('div'); nameEl.style.fontWeight='700'; nameEl.style.fontSize='1.05rem'; nameEl.textContent = p.name || '—';
  const unameEl = document.createElement('div'); unameEl.style.color='var(--ash)'; unameEl.style.fontSize='.86rem'; unameEl.textContent = p.username?('@'+p.username):'';
  const bioEl = document.createElement('div'); bioEl.style.color='var(--dust)'; bioEl.style.marginTop='.45rem'; bioEl.textContent = p.bio||'';
  info.appendChild(nameEl); info.appendChild(unameEl); info.appendChild(bioEl);
  row.appendChild(info);
  card.appendChild(row);

  // friends list
  const friendsLabel = document.createElement('div'); friendsLabel.style.marginTop='.7rem'; friendsLabel.style.fontSize='.78rem'; friendsLabel.style.color='var(--ash)'; friendsLabel.textContent='Amigos';
  card.appendChild(friendsLabel);
  const friendsWrap = document.createElement('div'); friendsWrap.className='profile-friends'; card.appendChild(friendsWrap);
  // load friends
  const friendIds = await loadFriendsFor(p.id);
  if(friendIds && friendIds.length){
    friendIds.slice(0,12).forEach(fid=>{ const c=document.createElement('div'); c.className='friend-chip'; c.textContent = fid; c.onclick=()=>openPublicProfile(fid); friendsWrap.appendChild(c); });
  } else {
    const none=document.createElement('div'); none.style.color='var(--dust)'; none.style.padding='.6rem 0'; none.textContent='Nenhum amigo públicamente listado.'; friendsWrap.appendChild(none);
  }

  // friend action buttons if viewing other user
  const actions = document.createElement('div'); actions.style.display='flex'; actions.style.gap='.5rem'; actions.style.marginTop='.8rem';
  if(p.id !== U.id){
    const rel = await getFriendRelation(U.id, p.id);
    if(rel==='friends'){
      const btn = document.createElement('button'); btn.className='btn bg2'; btn.textContent='Remover amigo'; btn.onclick=()=>{ removeFriend(p.id); closeModal('publicProfileModal'); };
      actions.appendChild(btn);
    } else if(rel==='request_sent'){
      const btn = document.createElement('button'); btn.className='btn bg2'; btn.textContent='Cancelar solicitação'; btn.onclick=()=>{ cancelFriendRequest(p.id); closeModal('publicProfileModal'); };
      actions.appendChild(btn);
    } else if(rel==='request_received'){
      const btn = document.createElement('button'); btn.className='btn bp'; btn.textContent='Aceitar amizade'; btn.onclick=()=>{ acceptFriendRequest(p.id); closeModal('publicProfileModal'); };
      actions.appendChild(btn);
    } else {
      const btn = document.createElement('button'); btn.className='btn bp'; btn.textContent='Adicionar amigo'; btn.onclick=()=>{ sendFriendRequest(p.id); closeModal('publicProfileModal'); };
      actions.appendChild(btn);
    }
  } else {
    const btn = document.createElement('button'); btn.className='btn bp'; btn.textContent='Editar perfil'; btn.onclick=()=>{ closeModal('publicProfileModal'); openSettings(); };
    actions.appendChild(btn);
  }
  card.appendChild(actions);

  container.appendChild(card);
  $('publicProfileModal').classList.add('on');
}

/* ── FRIENDS — backend functions (Supabase) ── */
async function sendFriendRequest(toId){ try{ const supa=getSupa(); const payload={from_id: U.id, to_id: toId, status:'pending', created_at: new Date().toISOString()}; const { data, error } = await supa.from('friend_requests').insert(payload); if(error){ console.warn(error); toast('Erro ao enviar','err'); return; } toast('Solicitação enviada','ok'); }catch(e){console.warn(e);toast('Erro','err');} }
async function acceptFriendRequest(fromId){ try{ const supa=getSupa(); const { data, error } = await supa.from('friend_requests').update({ status:'accepted' }).match({ from_id: fromId, to_id: U.id }).select(); if(error){ console.warn(error); toast('Erro','err'); return; } toast('Agora são amigos','ok'); }catch(e){console.warn(e);}
}
async function cancelFriendRequest(toId){ try{ const supa=getSupa(); const { error } = await supa.from('friend_requests').delete().match({ from_id: U.id, to_id: toId }); if(error){ console.warn(error); toast('Erro','err'); return; } toast('Solicitação cancelada','ok'); }catch(e){console.warn(e);} }
async function removeFriend(otherId){ try{ const supa=getSupa(); // remove accepted both directions
  await supa.from('friend_requests').delete().or(`(from_id.eq.${U.id},to_id.eq.${U.id})`).match({ status:'accepted' }).catch(()=>{});
  // simpler: delete any request between the pair
  await supa.from('friend_requests').delete().or(`(and(from_id.eq.${U.id},to_id.eq.${otherId})),and(from_id.eq.${otherId},to_id.eq.${U.id})`).catch(()=>{});
  toast('Amigo removido','ok'); }catch(e){console.warn(e);}
}

async function getFriendRelation(meId, otherId){ // returns 'friends'|'request_sent'|'request_received'|null
  try{ const supa=getSupa(); const { data, error } = await supa.from('friend_requests').select('*').or(`(from_id.eq.${meId},to_id.eq.${meId})`).limit(50); if(error) return null; // find relation
    for(const r of data){ if(r.from_id===meId && r.to_id===otherId){ if(r.status==='accepted') return 'friends'; if(r.status==='pending') return 'request_sent'; }
      if(r.from_id===otherId && r.to_id===meId){ if(r.status==='accepted') return 'friends'; if(r.status==='pending') return 'request_received'; }
    }
    return null;
  }catch(e){console.warn(e); return null; }
}

async function loadFriendsFor(uid){ try{ const supa=getSupa(); const { data, error } = await supa.from('friend_requests').select('*').or(`(from_id.eq.${uid},to_id.eq.${uid})`).limit(200); if(error) return []; const ids=[]; data.forEach(r=>{ if(r.status==='accepted'){ if(r.from_id!==uid) ids.push(r.from_id); if(r.to_id!==uid) ids.push(r.to_id); } }); return Array.from(new Set(ids)); }catch(e){return []; } }

async function searchMembers(){ const q = $('memberSearchInput').value.trim(); if(!q) return; try{ const supa=getSupa(); const { data, error } = await supa.from('profiles').select('*').or(`username.ilike.%${q}%,name.ilike.%${q}%`).limit(30); const wrap=$('memberSearchResults'); wrap.innerHTML=''; if(error||!data) { wrap.textContent='Erro ou nenhum resultado'; return; } data.forEach(p=>{ const r=document.createElement('div'); r.style.display='flex'; r.style.justifyContent='space-between'; r.style.alignItems='center'; r.style.gap='.6rem'; r.style.padding='.45rem'; r.style.borderBottom='1px solid var(--ghost)'; r.innerHTML=`<div style="display:flex;gap:.6rem;align-items:center"><div style="width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--ridge)">${p.photo?`<img src='${p.photo}' style='width:100%;height:100%;object-fit:cover'>`:`<div style='display:flex;align-items:center;justify-content:center;height:100%'>${(p.name||'A').charAt(0)}</div>`}</div><div><div style="font-weight:600">${p.name||'—'}</div><div style="color:var(--ash);font-size:.82rem">${p.username?('@'+p.username):''}</div></div></div>`; const btn = document.createElement('button'); btn.className='btn bp bsm'; btn.textContent='Abrir'; btn.onclick=()=>{ openPublicProfile(p.id); }; r.appendChild(btn); wrap.appendChild(r); }); }catch(e){console.warn(e); } }
