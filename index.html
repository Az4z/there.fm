<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>there.fm | Collaborating</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --void: #070708; --abyss: #0c0c0e; --depth: #121216; --surface: #1a1a20;
  --ridge: #25252d; --mist: #2e2e38; --fog: #3d3d4a; --bone: #e8e4dc;
  --ash: #b8b0a4; --dust: #8a8278; --shadow: #5a544e; --crimson: #c45c5c;
  --crimson-glow: rgba(196,92,92,0.12); --gold: #b8a070; --gold-glow: rgba(184,160,112,0.15);
  --silver: #8a9098; --ghost: rgba(232,228,220,0.04); --glass: rgba(18,18,22,0.88);
  --blur: blur(20px) saturate(140%); --ease: cubic-bezier(0.16,1,0.3,1);
  --r-md: 10px; --r-lg: 16px; --r-xl: 24px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'Inter',sans-serif; background:var(--void); color:var(--bone); overflow:hidden; height:100vh; }

/* Background */
.void { position:fixed; inset:0; z-index:0; }
.orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:.12; animation:orbFloat 20s infinite; }
.orb:nth-child(1){width:400px;height:400px;background:var(--crimson);top:10%;left:15%;}
@keyframes orbFloat { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-30px)} }

/* Scenes */
.scene { position:fixed; inset:0; z-index:10; display:none; opacity:0; transition:opacity .5s; }
.scene.active { display:flex; opacity:1; flex-direction:column; }

/* Auth */
.auth-scene { justify-content:center; align-items:center; }
.auth-card { background:var(--glass); backdrop-filter:var(--blur); padding:2.5rem; border-radius:var(--r-xl); border:1px solid var(--ghost); width:90%; max-width:400px; }
.auth-brand h1 { font-family:'Cinzel',serif; text-align:center; letter-spacing:4px; margin-bottom:2rem; }

/* Room Layout */
.room-header { padding:1rem; display:flex; justify-content:space-between; background:var(--glass); backdrop-filter:var(--blur); border-bottom:1px solid var(--ghost); z-index:100; }
.canvas-wrap { flex:1; position:relative; overflow:hidden; }
.items { position:absolute; inset:0; }

/* Draggable & Resizable */
.draggable { 
    position:absolute; background:var(--glass); border:1px solid var(--ghost); border-radius:var(--r-md); 
    min-width:100px; min-height:100px; touch-action:none; 
}
.resizer {
    position: absolute; width: 15px; height: 15px; background: var(--crimson);
    right: 0; bottom: 0; cursor: nwse-resize; border-radius: 50% 0 0 0;
}

/* Avatar */
.avatar { 
    position:absolute; width:60px; height:60px; border-radius:50%; background:var(--crimson);
    display:flex; justify-content:center; align-items:center; font-family:'Cinzel',serif;
    border:2px solid var(--bone); z-index:1000; cursor:grab;
}
.avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; }

/* Form Elements */
input { width:100%; padding:.8rem; margin-bottom:1rem; background:var(--abyss); border:1px solid var(--ridge); color:white; border-radius:var(--r-md); }
.btn { padding:.8rem 1.5rem; border:none; border-radius:var(--r-md); cursor:pointer; font-weight:600; transition: .3s; }
.btn-primary { background:var(--crimson); color:white; width:100%; }

/* UI Overlay */
.msg-input-wrap { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:2000; display:flex; gap:10px; width:90%; max-width:500px; }
.participants { position:fixed; right:20px; top:80px; background:var(--glass); padding:1rem; border-radius:var(--r-md); }

/* YouTube Sync Controls */
.yt-controls { display:flex; gap:5px; padding:5px; background:var(--abyss); justify-content:center; }
.yt-controls button { background:var(--ridge); color:white; border:none; padding:4px 8px; font-size:10px; cursor:pointer; }
</style>
</head>
<body>

<div class="void"><div class="orb"></div></div>

<div class="scene auth-scene active" id="authScene">
    <div class="auth-card">
        <div class="auth-brand"><h1>there.fm</h1></div>
        <input type="email" id="authEmail" placeholder="Email">
        <input type="password" id="authPass" placeholder="Senha">
        <button class="btn btn-primary" onclick="handleAuth()">Entrar / Criar</button>
    </div>
</div>

<div class="scene auth-scene" id="landingScene">
    <div class="auth-card">
        <h2>Bem-vindo</h2>
        <p id="welcomeMsg" style="margin-bottom:1rem"></p>
        <button class="btn btn-primary" onclick="createNewRoom()">Criar Nova Sala</button>
        <button class="btn" style="color:var(--ash)" onclick="openSettings()">Configurações de Perfil</button>
        <button class="btn" style="color:red" onclick="logout()">Sair</button>
    </div>
</div>

<div class="scene room-scene" id="roomScene">
    <div class="room-header">
        <div><span id="roomTitle">Sala</span> | <small id="roomCode"></small></div>
        <div>
            <button onclick="openImagePicker()">+ Imagem</button>
            <button onclick="openGifModal()">+ GIF</button>
            <button onclick="openVideoModal()">+ YouTube</button>
            <button onclick="leaveRoom()">Sair</button>
        </div>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
        <div class="items" id="items"></div>
    </div>
    <div class="msg-input-wrap">
        <input type="text" id="msgInput" placeholder="Conversar...">
        <button class="btn btn-primary" style="width:auto" onclick="sendMsg()">Enviar</button>
    </div>
</div>

<div class="scene auth-scene" id="settingsModal" style="background:rgba(0,0,0,0.8)">
    <div class="auth-card">
        <h3>Editar Perfil</h3>
        <label>Mudar Nome:</label>
        <input type="text" id="editName">
        <label>Mudar Foto (Galeria):</label>
        <input type="file" id="editPhoto" accept="image/*" onchange="updateProfilePhoto(this)">
        <button class="btn btn-primary" onclick="closeSettings()">Salvar e Voltar</button>
    </div>
</div>

<script id="youtube-api" src="https://www.youtube.com/iframe_api"></script>

<script>
/* --- STATE --- */
let currentUser = { name: "User", photo: null, id: Date.now() };
let currentRoom = null;
let ytPlayers = {}; // Para controlar múltiplos vídeos sincronizados

/* --- AUTH & PROFILE --- */
function handleAuth() {
    currentUser.name = document.getElementById('authEmail').value.split('@')[0] || "User";
    document.getElementById('welcomeMsg').innerText = "Olá, " + currentUser.name;
    document.getElementById('editName').value = currentUser.name;
    showScene('landingScene');
}

function openSettings() { showScene('settingsModal'); }
function closeSettings() { 
    currentUser.name = document.getElementById('editName').value;
    updateMyAvatarUI();
    showScene('landingScene'); 
}

function updateProfilePhoto(input) {
    const file = input.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (e) => { currentUser.photo = e.target.result; };
        reader.readAsDataURL(file);
    }
}

function showScene(id) {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* --- ROOM LOGIC --- */
function createNewRoom() {
    currentRoom = "ROOM-" + Math.floor(Math.random()*9999);
    document.getElementById('roomTitle').innerText = "Minha Sala";
    document.getElementById('roomCode').innerText = currentRoom;
    showScene('roomScene');
    spawnAvatar(currentUser);
}

function spawnAvatar(user) {
    const div = document.createElement('div');
    div.className = "avatar";
    div.id = "user-" + user.id;
    updateAvatarContent(div, user);
    makeDraggable(div);
    document.getElementById('items').appendChild(div);
}

function updateMyAvatarUI() {
    const av = document.getElementById("user-" + currentUser.id);
    if(av) updateAvatarContent(av, currentUser);
}

function updateAvatarContent(el, user) {
    if(user.photo) el.innerHTML = `<img src="${user.photo}">`;
    else el.innerText = user.name[0].toUpperCase();
}

/* --- ADICIONAR IMAGEM DA GALERIA --- */
function openImagePicker() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = event => { createMediaElement('image', event.target.result); };
        reader.readAsDataURL(file);
    };
    input.click();
}

/* --- TENOR GIF FIX --- */
async function openGifModal() {
    const query = prompt("Pesquisar GIF:");
    if(!query) return;
    // API Key pública de exemplo (Tenor V2)
    const url = `https://tenor.googleapis.com/v2/search?q=${query}&key=LIVDSRZULELA&limit=1`;
    try {
        const res = await fetch(url);
        const data = await res.json();
        if(data.results.length > 0) {
            createMediaElement('gif', data.results[0].media_formats.tinygif.url);
        }
    } catch(e) { alert("Erro ao carregar Tenor"); }
}

/* --- DRAG & RESIZE (TOUCH COMPATIBLE) --- */
function makeDraggable(el) {
    let isDragging = false;
    let isResizing = false;
    let startX, startY, startW, startH, startLeft, startTop;

    // Adicionar alça de redimensionamento
    if(!el.classList.contains('avatar')) {
        const resizer = document.createElement('div');
        resizer.className = 'resizer';
        el.appendChild(resizer);
        
        resizer.addEventListener('mousedown', initResize);
        resizer.addEventListener('touchstart', initResize);
    }

    el.addEventListener('mousedown', initDrag);
    el.addEventListener('touchstart', initDrag);

    function initDrag(e) {
        if(e.target.classList.contains('resizer')) return;
        isDragging = true;
        const t = e.type === 'touchstart' ? e.touches[0] : e;
        startX = t.clientX - el.offsetLeft;
        startY = t.clientY - el.offsetTop;
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('touchmove', doDrag, {passive:false});
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchend', stopDrag);
    }

    function doDrag(e) {
        if(!isDragging) return;
        e.preventDefault();
        const t = e.type === 'touchmove' ? e.touches[0] : e;
        el.style.left = (t.clientX - startX) + 'px';
        el.style.top = (t.clientY - startY) + 'px';
    }

    function initResize(e) {
        isResizing = true;
        const t = e.type === 'touchstart' ? e.touches[0] : e;
        startW = el.offsetWidth;
        startH = el.offsetHeight;
        startX = t.clientX;
        startY = t.clientY;
        document.addEventListener('mousemove', doResize);
        document.addEventListener('touchmove', doResize, {passive:false});
        document.addEventListener('mouseup', stopResize);
        document.addEventListener('touchend', stopResize);
    }

    function doResize(e) {
        if(!isResizing) return;
        const t = e.type === 'touchmove' ? e.touches[0] : e;
        el.style.width = (startW + (t.clientX - startX)) + 'px';
        el.style.height = (startH + (t.clientY - startY)) + 'px';
    }

    function stopDrag() { isDragging = false; }
    function stopResize() { isResizing = false; }
}

/* --- YOUTUBE SYNC LOGIC --- */
function openVideoModal() {
    const url = prompt("Link do YouTube:");
    if(!url) return;
    const id = url.match(/(?:v=|\/embed\/|youtu.be\/)([^&?/\s]+)/)[1];
    createMediaElement('youtube', id);
}

function createMediaElement(type, content) {
    const container = document.createElement('div');
    container.className = "draggable";
    container.style.left = "100px";
    container.style.top = "100px";
    container.style.width = "300px";
    
    if(type === 'image' || type === 'gif') {
        container.innerHTML = `<img src="${content}" style="width:100%; height:100%; border-radius:8px; object-fit:cover">`;
    } else if(type === 'youtube') {
        const playerDivId = "player-" + Date.now();
        container.style.height = "200px";
        container.innerHTML = `
            <div id="${playerDivId}" style="width:100%; height:80%"></div>
            <div class="yt-controls">
                <button onclick="syncYT('${playerDivId}', 'play')">PLAY</button>
                <button onclick="syncYT('${playerDivId}', 'pause')">PAUSE</button>
                <button onclick="syncYT('${playerDivId}', 'back')">-10s</button>
                <button onclick="syncYT('${playerDivId}', 'forward')">+10s</button>
            </div>
        `;
        setTimeout(() => {
            ytPlayers[playerDivId] = new YT.Player(playerDivId, {
                videoId: content,
                playerVars: { 'autoplay': 0, 'controls': 0 }
            });
        }, 500);
    }
    
    makeDraggable(container);
    document.getElementById('items').appendChild(container);
}

// Esta função simula o que seria enviado via Socket para todos os usuários
function syncYT(playerId, action) {
    const player = ytPlayers[playerId];
    if(!player) return;

    switch(action) {
        case 'play': player.playVideo(); break;
        case 'pause': player.pauseVideo(); break;
        case 'back': player.seekTo(player.getCurrentTime() - 10); break;
        case 'forward': player.seekTo(player.getCurrentTime() + 10); break;
    }
    // Em um sistema real, você enviaria: emit('sync_video', {playerId, action, time: player.getCurrentTime()})
}

function sendMsg() {
    const input = document.getElementById('msgInput');
    if(!input.value) return;
    alert("Você disse: " + input.value); // Placeholder para o chat
    input.value = "";
}
</script>
</body>
</html>
